[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "muxiva-codex-relay"
version = "0.1.0"
description = "LAN relay that submits cleaned ESP32 dictation to local Codex sessions"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "numpy>=2,<3",
  "sherpa-onnx>=1.13,<2",
  "websocket-client>=1.8,<2",
]
license = {text = "MIT"}
authors = [{name = "PiyotaHu"}]
keywords = ["codex", "esp32", "xiaozhi", "dictation", "s1-mini"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: MIT License",
  "Operating System :: MacOS",
  "Operating System :: Microsoft :: Windows",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]

[project.scripts]
muxiva-codex-relay = "muxiva_codex_relay.app:main"

[project.optional-dependencies]
dev = ["pytest>=8.0"]
ble = ["bleak>=0.22,<2"]

[tool.hatch.build.targets.wheel]
packages = ["src/muxiva_codex_relay"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
